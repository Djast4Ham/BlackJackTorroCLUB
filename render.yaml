services:
  - type: web
    name: bar-znakomstv-vk
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: bar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: VK_APP_ID
        value: 54584981
      - key: VK_ADMIN_ID
        value: 1057236881
      - key: TRUST_PROXY
        value: 1
      - key: SQLITE_PATH
        value: /var/data/bar.sqlite
      - key: MAX_STORED_MESSAGES
        value: 5000
      - key: MAX_ADMIN_LOGS
        value: 5000
      - key: MAX_TRANSACTIONS
        value: 20000
      - key: ADMIN_INITIAL_BJT
        value: 1000
      - key: DEFAULT_INITIAL_BJT
        value: 50
      - key: VK_SIGN_MAX_AGE_SECONDS
        value: 172800
      - key: VK_CLIENT_SECRET
        sync: false
      - key: VK_SERVICE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
